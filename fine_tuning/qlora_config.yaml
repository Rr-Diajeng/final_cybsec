# ============================================================
# fine_tuning/qlora_config.yaml
# QLoRA SFT config for LLaMA-Factory
# Target model: meta-llama/Llama-3.2-3B-Instruct
# Task:         Binary phishing email classification
# ============================================================

### Model
model_name_or_path: meta-llama/Llama-3.2-3B-Instruct

### Method
stage:            sft
do_train:         true
finetuning_type:  lora

### LoRA parameters
lora_rank:         16
lora_alpha:        32
lora_dropout:      0.05
lora_target:       q_proj,v_proj    # attention projections only; keeps adapter small

### Quantization (QLoRA — 4-bit NF4)
quantization_bit:  4
quantization_type: nf4              # NF4 quantization; better than fp4 for LLMs
double_quantization: true           # quantize the quantization constants too

### Dataset
# Place phishing_train.json and phishing_val.json under LLaMA-Factory/data/
# and register them in LLaMA-Factory/data/dataset_info.json (see dataset_info.json)
dataset:           phishing_train
val_size:          0.0              # we supply a separate val set
eval_dataset:      phishing_val
dataset_dir:       data             # relative to LLaMA-Factory root
template:          llama3           # use the Llama-3 chat template

### Training hyper-parameters
output_dir:            saves/llama3-phishing-qlora
logging_dir:           saves/llama3-phishing-qlora/logs
per_device_train_batch_size: 4
gradient_accumulation_steps: 4      # effective batch = 16
num_train_epochs:      3
learning_rate:         2.0e-4
lr_scheduler_type:     cosine
warmup_ratio:          0.05
max_seq_length:        2048
cutoff_len:            2048

### Optimizer
optim:             adamw_torch_fused

### Evaluation and checkpointing
evaluation_strategy:  steps
eval_steps:           100
save_strategy:        steps
save_steps:           100
save_total_limit:     3
load_best_model_at_end: true
metric_for_best_model: eval_loss

### Logging
logging_steps:     10
report_to:         none             # set to "wandb" if you want W&B tracking
fp16:              false
bf16:              true             # use bfloat16 on Ampere+ GPUs (A100 / RTX 30xx+)

### Misc
seed:              42
dataloader_num_workers: 2
remove_unused_columns: false
